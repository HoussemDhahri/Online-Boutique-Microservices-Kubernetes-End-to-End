apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-deployment
  labels:
    app: cart-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cart-app

  template:
    metadata:
      labels:
        app: cart-app

    spec:
      containers:
        - name: cart-container
          image: houssemdhahri93/cartservice

          imagePullPolicy: Always
          
          ports:
            - containerPort: 7070

          envFrom:
            - configMapRef:
                name: cart-config

          readinessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"