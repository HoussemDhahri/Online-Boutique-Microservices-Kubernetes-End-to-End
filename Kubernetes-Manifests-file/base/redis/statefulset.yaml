apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cart-statefulset
  labels:
    app: redis-app

spec:
  serviceName: redis-cart-service
  replicas: 1

  selector:
    matchLabels:
      app: redis-app

  template:
    metadata:
      labels:
        app: redis-app

    spec:
      containers:
        - name: redis-container
          image: redis:alpine
          imagePullPolicy: Always
          
          ports:
            - containerPort: 6379

          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-cart-pvc