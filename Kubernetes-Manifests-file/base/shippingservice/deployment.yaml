apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-deployment
  labels:
    app: shipping-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: shipping-app

  template:
    metadata:
      labels:
        app: shipping-app

    spec:
      containers:
        - name: shipping-container
          image: houssemdhahri93/shippingservice

          imagePullPolicy: Always
          
          ports:
            - containerPort: 50051

          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"