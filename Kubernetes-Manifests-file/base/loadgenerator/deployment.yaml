apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator-deployment
  labels:
    app: loadgenerator-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loadgenerator-app

  template:
    metadata:
      labels:
        app: loadgenerator-app

    spec:
      containers:
        - name: loadgenerator-container
          image: houssemdhahri93/loadgenerator

          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: loadgenerator-config

          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"