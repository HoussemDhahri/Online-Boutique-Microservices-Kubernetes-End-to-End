apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: onlineboutique-loadtest
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/HoussemDhahri/Online-Boutique-Microservices-Kubernetes-End-to-End.git
    targetRevision: HEAD
    path: Kubernetes-Manifests-file/overlays/prod/loadgenerator

  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique-prod

  syncPolicy: {}