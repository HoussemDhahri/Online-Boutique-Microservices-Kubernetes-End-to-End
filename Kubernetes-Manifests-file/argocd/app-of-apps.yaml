apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/HoussemDhahri/Online-Boutique-Microservices-Kubernetes-End-to-End.git
    targetRevision: main
    path: Kubernetes-Manifests-file/argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true